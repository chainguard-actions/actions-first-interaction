name: Test PR message only
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run first-interaction action with pr_message only
        id: action
        uses: .
        with:
          pr_message: "Thank you for your first pull request! Our team will review it shortly."
          repo_token: ${{ github.token }}
      - name: Assert action completed without error
        run: |
          echo "Action completed successfully with pr_message only"
          echo "PASS"
