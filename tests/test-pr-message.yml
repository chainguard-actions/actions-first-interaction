name: Test pr_message input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with pr_message
        id: action
        uses: .
        with:
          pr_message: "Welcome! Thanks for opening your first pull request."
          repo_token: ${{ github.token }}

      - name: Assert action completed without error
        run: |
          echo "Action completed successfully (no PR context under workflow_dispatch is expected)"
          echo "PASS"
