name: Test PR-only message
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          pr_message: "Thanks for your first pull request! We appreciate your contribution."
          repo_token: ${{ github.token }}
      - name: Assert action completed without error
        run: |
          echo "Action completed successfully with only pr_message set."
          echo "PASS: action ran without crashing when issue_message is omitted"
