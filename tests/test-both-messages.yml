name: Test both issue_message and pr_message inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with both issue_message and pr_message
        id: action
        uses: .
        with:
          issue_message: "Welcome! Thanks for opening your first issue."
          pr_message: "Welcome! Thanks for opening your first pull request."
          repo_token: ${{ github.token }}

      - name: Assert action completed without error
        run: |
          echo "Action completed successfully with both messages configured"
          echo "PASS"
