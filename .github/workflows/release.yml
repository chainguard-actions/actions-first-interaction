name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Release Version
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-tags: true

      - name: Tag
        id: tag
        uses: issue-ops/semver@5b8bb084b6834d03ddb5c7c96c683a588a2072ca # v2
        with:
          manifest-path: package.json
          workspace: ${{ github.workspace }}
          ref: main

      - name: Create Release
        id: release
        uses: issue-ops/releaser@e6768024642153d17c157995e2684a3ebcae14e7 # v2
        with:
          tag: v${{ steps.tag.outputs.version }}
